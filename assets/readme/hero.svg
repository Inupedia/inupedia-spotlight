<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Inupedia Spotlight</title>
  <desc id="desc">Inupedia Spotlight is a framework-agnostic agent runtime for existing frontend products, turning real product capabilities into typed, skill-routed agent actions with recoverable runs, knowledge, and memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B11"/>
      <stop offset="58%" stop-color="#0A1018"/>
      <stop offset="100%" stop-color="#0D1320"/>
    </linearGradient>
    <radialGradient id="spot" cx="83%" cy="14%" r="72%">
      <stop offset="0%" stop-color="#55D6FF" stop-opacity="0.24"/>
      <stop offset="38%" stop-color="#8B5CF6" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0B1018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6EE7F9"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111925"/>
      <stop offset="100%" stop-color="#0D141E"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="32" fill="url(#spot)"/>
  <rect x="1" y="1" width="1198" height="518" rx="31" fill="none" stroke="#243246"/>

  <g transform="translate(72 66)">
    <text x="0" y="0" fill="#78DDF7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2.2">INUPEDIA / FRONTEND AGENT RUNTIME</text>

    <text x="0" y="100" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="86" font-weight="850" letter-spacing="-3">Spotlight</text>

    <rect x="0" y="126" width="164" height="5" rx="2.5" fill="url(#accent)"/>

    <text x="0" y="190" fill="#D7E0EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="29" font-weight="650">
      Turn real frontend capabilities
    </text>
    <text x="0" y="228" fill="#D7E0EA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="29" font-weight="650">
      into safe agent actions.
    </text>

    <text x="0" y="280" fill="#8FA0B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">
      Keep your product as the source of truth.
    </text>
    <text x="0" y="313" fill="#8FA0B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20">
      Typed capabilities, skill routing, recoverable runs.
    </text>

    <g transform="translate(0 356)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#0F1722" stroke="#2A3B50"/>
      <text x="75" y="27" text-anchor="middle" fill="#DCE7F3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Frontend Core</text>

      <rect x="164" y="0" width="136" height="42" rx="21" fill="#0F1722" stroke="#2A3B50"/>
      <text x="232" y="27" text-anchor="middle" fill="#DCE7F3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Client Tools</text>

      <rect x="314" y="0" width="114" height="42" rx="21" fill="#0F1722" stroke="#2A3B50"/>
      <text x="371" y="27" text-anchor="middle" fill="#DCE7F3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Skills</text>

      <rect x="442" y="0" width="160" height="42" rx="21" fill="#0F1722" stroke="#2A3B50"/>
      <text x="522" y="27" text-anchor="middle" fill="#DCE7F3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">LangGraph</text>
    </g>
  </g>

  <g transform="translate(780 72)">
    <text x="0" y="0" fill="#8DA0B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="1.4">WHAT SPOTLIGHT ADDS</text>

    <g transform="translate(0 34)">
      <rect x="0" y="0" width="348" height="104" rx="20" fill="url(#card)" stroke="#2A3A4F"/>
      <circle cx="34" cy="34" r="10" fill="#64D9F5"/>
      <text x="58" y="39" fill="#F3F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="750">Capability Layer</text>
      <text x="28" y="74" fill="#8FA0B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">typed adapters over real product APIs</text>
    </g>

    <g transform="translate(0 152)">
      <rect x="0" y="0" width="348" height="104" rx="20" fill="url(#card)" stroke="#2A3A4F"/>
      <circle cx="34" cy="34" r="10" fill="#8B9DFF"/>
      <text x="58" y="39" fill="#F3F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="750">Skill-routed Runtime</text>
      <text x="28" y="74" fill="#8FA0B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">route · plan · knowledge · actions</text>
    </g>

    <g transform="translate(0 270)">
      <rect x="0" y="0" width="348" height="104" rx="20" fill="url(#card)" stroke="#2A3A4F"/>
      <circle cx="34" cy="34" r="10" fill="#B68CFF"/>
      <text x="58" y="39" fill="#F3F7FB" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="750">Recoverable Runs</text>
      <text x="28" y="74" fill="#8FA0B5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">SSE resume · uiContext · memory</text>
    </g>
  </g>
</svg>