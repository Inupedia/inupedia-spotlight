<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Spotlight</title><desc id="desc">Spotlight is a framework-agnostic agent runtime that turns real frontend capabilities into safe agent actions.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0d1320"/></linearGradient><radialGradient id="spot" cx="83%" cy="14%" r="72%"><stop offset="0" stop-color="#55d6ff" stop-opacity=".24"/><stop offset="38%" stop-color="#8b5cf6" stop-opacity=".11"/><stop offset="100%" stop-color="#0b1018" stop-opacity="0"/></radialGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6ee7f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111925"/><stop offset="1" stop-color="#0d141e"/></linearGradient></defs>
<rect width="1200" height="520" rx="32" fill="url(#bg)"/><rect width="1200" height="520" rx="32" fill="url(#spot)"/><rect x="1" y="1" width="1198" height="518" rx="31" fill="none" stroke="#243246"/>
<g transform="translate(72 66)"><text x="0" y="0" fill="#78ddf7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="700" letter-spacing="2.2">FRONTEND AGENT RUNTIME</text><text x="0" y="100" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="86" font-weight="850" letter-spacing="-3">Spotlight</text><rect x="0" y="126" width="164" height="5" rx="2.5" fill="url(#accent)"/><text x="0" y="190" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="29" font-weight="650">One intelligent entry point</text><text x="0" y="228" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="29" font-weight="650">for the whole product.</text><text x="0" y="280" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="20">Search, navigate, explain, and act through real capabilities.</text><text x="0" y="313" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="20">Keep the host product as the source of truth.</text><g transform="translate(0 356)"><rect width="150" height="42" rx="21" fill="#0f1722" stroke="#2a3b50"/><text x="75" y="27" text-anchor="middle" fill="#dce7f3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">Frontend Core</text><rect x="164" width="136" height="42" rx="21" fill="#0f1722" stroke="#2a3b50"/><text x="232" y="27" text-anchor="middle" fill="#dce7f3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">Client Tools</text><rect x="314" width="114" height="42" rx="21" fill="#0f1722" stroke="#2a3b50"/><text x="371" y="27" text-anchor="middle" fill="#dce7f3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">Skills</text><rect x="442" width="160" height="42" rx="21" fill="#0f1722" stroke="#2a3b50"/><text x="522" y="27" text-anchor="middle" fill="#dce7f3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">LangGraph</text></g></g>
<g transform="translate(780 72)"><text x="0" y="0" fill="#8da0b7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" letter-spacing="1.4">WHAT SPOTLIGHT ADDS</text><g transform="translate(0 34)"><rect width="348" height="104" rx="20" fill="url(#card)" stroke="#2a3a4f"/><circle cx="34" cy="34" r="10" fill="#64d9f5"/><text x="58" y="39" fill="#f3f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="750">Capability Layer</text><text x="28" y="74" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="17">typed adapters over real product APIs</text></g><g transform="translate(0 152)"><rect width="348" height="104" rx="20" fill="url(#card)" stroke="#2a3a4f"/><circle cx="34" cy="34" r="10" fill="#8b9dff"/><text x="58" y="39" fill="#f3f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="750">Skill-routed Runtime</text><text x="28" y="74" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="17">route · plan · knowledge · actions</text></g><g transform="translate(0 270)"><rect width="348" height="104" rx="20" fill="url(#card)" stroke="#2a3a4f"/><circle cx="34" cy="34" r="10" fill="#b68cff"/><text x="58" y="39" fill="#f3f7fb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="750">Recoverable Runs</text><text x="28" y="74" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="17">SSE resume · uiContext · memory</text></g></g></svg>