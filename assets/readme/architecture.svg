    <circle cx="28" cy="30" r="15" fill="#0c1824" stroke="#7b9cff" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" fill="#7b9cff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">4</text>
    <text x="54" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Spotlight Runtime</text>
    <g transform="translate(18 66)">
      <rect width="214" height="42" rx="11" fill="#0b1119" stroke="#26364b"/><text x="18" y="27" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Skills</text>
      <rect y="52" width="214" height="42" rx="11" fill="#0b1119" stroke="#26364b"/><text x="18" y="79" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">LangGraph route &amp; plan</text>
      <rect y="104" width="214" height="42" rx="11" fill="#0b1119" stroke="#26364b"/><text x="18" y="131" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Run Engine</text>
      <g transform="translate(0 160)">
        <rect width="66" height="44" rx="10" fill="#0b1119" stroke="#55d6ff"/><text x="33" y="19" text-anchor="middle" fill="#cfeffc" font-family="ui-monospace,monospace" font-size="12">Knowledge</text><text x="33" y="34" text-anchor="middle" fill="#8fa0b5" font-family="ui-monospace,monospace" font-size="11">RAG</text>
        <rect x="74" width="66" height="44" rx="10" fill="#0b1119" stroke="#7b9cff"/><text x="107" y="27" text-anchor="middle" fill="#d9ddff" font-family="ui-monospace,monospace" font-size="12">Memory</text>
        <rect x="148" width="66" height="44" rx="10" fill="#0b1119" stroke="#a78bfa"/><text x="181" y="19" text-anchor="middle" fill="#eadcff" font-family="ui-monospace,monospace" font-size="11">Models</text><text x="181" y="34" text-anchor="middle" fill="#8fa0b5" font-family="ui-monospace,monospace" font-size="11">Providers</text>
      </g>
    </g>
  </g>
  <path d="M226 303 H262" stroke="#77879c" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M572 303 H608" stroke="#77879c" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <path d="M856 303 H892" stroke="#77879c" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <path d="M891 333 H856" stroke="#55d6ff" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowCyan)"/>
  <rect x="48" y="464" width="1104" height="48" rx="16" fill="#0b1119" stroke="#243246"/>
  <path d="M82 481l5 10 10 5-10 5-5 10-5-10-10-5 10-5Z" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="112" y="494" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Keep the product as the <tspan fill="#55d6ff">source of truth</tspan>. Spotlight adds routing, execution, and memory around <tspan fill="#a78bfa">real frontend capabilities</tspan>.</text>
</svg>