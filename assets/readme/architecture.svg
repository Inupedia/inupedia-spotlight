    <circle cx="28" cy="30" r="15" fill="#0c1824" stroke="#55d6ff" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">1</text>
    <text x="54" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">User intent</text>
    <rect x="20" y="76" width="138" height="132" rx="18" fill="#0b1119" stroke="#26364b"/>
    <path d="M58 110 h62 a14 14 0 0 1 14 14 v28 a14 14 0 0 1-14 14 H92 l-18 16 v-16 H58 a14 14 0 0 1-14-14 v-28 a14 14 0 0 1 14-14Z" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="72" cy="138" r="4" fill="#55d6ff"/><circle cx="90" cy="138" r="4" fill="#7b9cff"/><circle cx="108" cy="138" r="4" fill="#a78bfa"/>
    <text x="89" y="232" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Natural-language</text>
    <text x="89" y="253" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">request</text>
  </g>
