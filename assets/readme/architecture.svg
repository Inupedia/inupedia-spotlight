      <ellipse cx="30" cy="133" rx="12" ry="5" fill="none" stroke="#a78bfa" stroke-width="2"/><path d="M18 133v14c0 3 5 5 12 5s12-2 12-5v-14" fill="none" stroke="#a78bfa" stroke-width="2"/><path d="M18 140c0 3 5 5 12 5s12-2 12-5" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="54" y="146" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Router · Store · Service · SDK</text>
    </g>
  </g>
  <g transform="translate(618 174)">
    <rect width="238" height="258" rx="20" fill="url(#panel)" stroke="#314158"/>
    <circle cx="28" cy="30" r="15" fill="#0c1824" stroke="#55d6ff" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">3</text>
    <text x="54" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Capability layer</text>
    <rect x="20" y="72" width="198" height="144" rx="18" fill="#0c1420" stroke="url(#accent)" stroke-width="1.7"/>
    <circle cx="119" cy="112" r="24" fill="#0b1119" stroke="#55d6ff"/>
    <path d="M107 119l25-25M126 92l8 8M101 125l8 8" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="119" y="163" text-anchor="middle" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="750">Typed Client Tools</text>
    <text x="119" y="190" text-anchor="middle" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">thin adapters over</text>
    <text x="119" y="208" text-anchor="middle" fill="#8fa0b5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">real product capabilities</text>
  </g>
  <g transform="translate(902 174)">
