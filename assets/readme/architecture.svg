<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Spotlight architecture</title>
  <desc id="desc">Framework-agnostic Spotlight architecture connecting user intent, the existing frontend product, typed Client Tools, Spotlight Runtime, knowledge, memory, and model providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0c131d"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#77879c"/></marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#55d6ff"/></marker>
  </defs>
  <rect width="1200" height="540" rx="30" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="538" rx="29" fill="none" stroke="#223044"/>
  <text x="48" y="44" fill="#55d6ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2.2">FRAMEWORK-AGNOSTIC AGENT RUNTIME</text>
  <text x="48" y="96" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="42" font-weight="800">Spotlight architecture</text>
  <text x="48" y="128" fill="#93a2b7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Keep the product as the source of truth. Add an agent layer around real frontend capabilities.</text>
