    <circle cx="28" cy="30" r="15" fill="#0c1824" stroke="#55d6ff" stroke-width="2"/>
    <text x="28" y="36" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">2</text>
    <text x="54" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">Existing frontend product</text>
