no-Regular,Menlo,Consolas,monospace" font-size="16">brittle</text><rect x="354" y="252" width="152" height="46" rx="23" fill="#0b1119" stroke="#fb7185" stroke-opacity=".75"/><text x="430" y="281" text-anchor="middle" fill="#fb7185" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">hard to govern</text></g><rect x="48" y="528" width="1104" height="44" rx="15" fill="#0b1119" stroke="#243246"/>
