<rect x="24" y="127" width="428" height="49" rx="12" fill="#0b1119" stroke="#26364b"/><text x="56" y="158" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16">Router / Store / Service</text><circle cx="40" cy="151.5" r="8" fill="none" stroke="#55d6ff" stroke-width="2"/>
<rect x="24" y="188" width="428" height="49" rx="12" fill="#0b1119" stroke="#26364b"/><text x="56" y="219" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16">Client Tools</text><circle cx="40" cy="212.5" r="8" fill="none" stroke="#55d6ff" stroke-width="2"/>
<rect x="24" y="249" width="428" height="49" rx="12" fill="#0b1119" stroke="#26364b"/><text x="56" y="280" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16">uiContext after action</text><circle cx="40" cy="273.5" r="8" fill="none" stroke="#55d6ff" stroke-width="2"/>
</g>
