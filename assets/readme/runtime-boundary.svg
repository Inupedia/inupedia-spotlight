<rect x="24" y="222" width="202" height="62" rx="12" fill="#0b1119" stroke="#26364b"/><text x="48" y="259" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="15">Memory</text><rect x="250" y="222" width="202" height="62" rx="12" fill="#0b1119" stroke="#26364b"/><text x="274" y="249" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14">Models /</text><text x="274" y="268" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="14">Providers</text>
</g>
<path d="M540 275 H660" stroke="#55d6ff" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M660 305 H540" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="600" y="256" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">browser RPC</text><text x="600" y="331" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">SSE / tool calls</text><rect x="546" y="356" width="108" height="72" rx="14" fill="#0b1119" stroke="#526177" stroke-dasharray="5 4"/><text x="600" y="384" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13">host remains</text><text x="600" y="403" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="13">source of truth</text>
<rect x="48" y="516" width="1104" height="44" rx="15" fill="#0b1119" stroke="#243246"/><text x="600" y="544" text-anchor="middle" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16">The frontend executes real actions. Spotlight coordinates intent, retrieval, state, and recovery.</text></svg>