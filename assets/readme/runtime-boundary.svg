<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Frontend host and Spotlight Runtime boundary</title><desc id="desc">Responsibility boundary between the frontend host and Spotlight Runtime with browser RPC, SSE tool calls, and the host remaining the source of truth.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0c1320"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111925"/><stop offset="1" stop-color="#0c131d"/></linearGradient><marker id="arrowC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#55d6ff"/></marker><marker id="arrowP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a78bfa"/></marker></defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="518" rx="29" fill="none" stroke="#223044"/>
  <text x="48" y="44" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="2.2">RUNTIME RESPONSIBILITIES</text>
  <text x="48" y="94" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="39" font-weight="800">Frontend host ↔ Spotlight Runtime boundary</text>
  <text x="48" y="124" fill="#93a2b7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Keep business execution in the host product while Spotlight manages routing, context, and runs.</text>
  <g transform="translate(48 160)"><rect width="430" height="280" rx="20" fill="url(#panel)" stroke="#34c9ef" stroke-width="1.5"/><text x="28" y="38" fill="#55d6ff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="750">Frontend host</text><g transform="translate(20 58)"><rect width="390" height="46" rx="12" fill="#0b1119" stroke="#26364b"/><text x="24" y="29" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">UI / Components</text><rect y="56" width="390" height="46" rx="12" fill="#0b1119" stroke="#26364b"/><text x="24" y="85" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Router / Store / Service</text><rect y="112" width="390" height="46" rx="12" fill="#0b1119" stroke="#26364b"/><text x="24" y="141" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Client Tools</text><rect y="168" width="390" height="46" rx="12" fill="#0b1119" stroke="#26364b"/><text x="24" y="197" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">uiContext after action</text></g></g>
  <g transform="translate(722 160)"><rect width="430" height="280" rx="20" fill="url(#panel)" stroke="url(#accent)" stroke-width="1.6"/><text x="28" y="38" fill="#8b9dff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="750">Spotlight Runtime</text><g transform="translate(20 58)"><rect width="188" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="18" y="35" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Skills</text><rect x="202" width="188" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="220" y="26" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">LangGraph</text><text x="220" y="45" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">route &amp; plan</text><rect y="70" width="188" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="18" y="105" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Run Engine</text><rect x="202" y="70" width="188" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="220" y="96" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Knowledge /</text><text x="220" y="115" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">RAG</text><rect y="140" width="188" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="18" y="175" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17">Memory</text><rect x="202" y="140" width="188" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="220" y="166" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Models /</text><text x="220" y="185" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Providers</text></g></g>
  <text x="600" y="214" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="15">browser RPC</text><path d="M490 230 H708" stroke="#55d6ff" stroke-width="2.2" stroke-dasharray="7 7" marker-start="url(#arrowC)" marker-end="url(#arrowC)"/>
  <text x="600" y="290" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="15">SSE / tool calls</text><path d="M490 306 H708" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="7 7" marker-start="url(#arrowP)" marker-end="url(#arrowP)"/>
  <rect x="520" y="340" width="160" height="62" rx="14" fill="#0b1119" stroke="#506078" stroke-dasharray="5 5"/><path d="M546 359l14-7 14 7v12c0 10-7 18-14 22-7-4-14-12-14-22Z" fill="none" stroke="#55d6ff" stroke-width="2"/><path d="M554 371l5 5 8-10" fill="none" stroke="#55d6ff" stroke-width="2" stroke-linecap="round"/><text x="580" y="366" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">host remains the</text><text x="580" y="386" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">source of truth</text>
  <rect x="48" y="458" width="1104" height="38" rx="14" fill="#0b1119" stroke="#243246"/><text x="600" y="482" text-anchor="middle" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">The frontend executes <tspan fill="#55d6ff">real product actions</tspan>. Spotlight coordinates <tspan fill="#a78bfa">intent, retrieval, state, and recovery</tspan>.</text>
</svg>