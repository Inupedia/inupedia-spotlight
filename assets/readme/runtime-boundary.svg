<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Frontend host and runtime boundary</title><desc id="desc">Balanced host and runtime panels with all bridge arrows fully in the center gap.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0c131d"/></linearGradient>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#7c8ba0"/></marker>
<marker id="cyanArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#55d6ff"/></marker>
<marker id="purpleArrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#a78bfa"/></marker>
</defs>
<rect width="1200" height="590" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="588" rx="29" fill="none" stroke="#223044"/><text x="48" y="44" fill="#55d6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2.2">RUNTIME RESPONSIBILITIES</text>
<text x="48" y="96" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800">Frontend host / Runtime boundary</text>
<text x="48" y="130" fill="#93a2b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18">Business execution stays in the host; Spotlight manages routing, context, and runs.</text><g transform="translate(48 174)"><rect width="468" height="326" rx="20" fill="url(#panel)" stroke="#55d6ff" stroke-opacity=".82"/><text x="24" y="42" fill="#55d6ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="750">Frontend host</text><rect x="24" y="68" width="420" height="48" rx="12" fill="#0b1119" stroke="#26364b"/><circle cx="44" cy="92" r="7" fill="none" stroke="#55d6ff" stroke-width="2"/><text x="64" y="99" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18">UI / Components</text><rect x="24" y="128" width="420" height="48" rx="12" fill="#0b1119" stroke="#26364b"/><circle cx="44" cy="152" r="7" fill="none" stroke="#55d6ff" stroke-width="2"/><text x="64" y="159" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18">Router / Store / Service</text><rect x="24" y="188" width="420" height="48" rx="12" fill="#0b1119" stroke="#26364b"/><circle cx="44" cy="212" r="7" fill="none" stroke="#55d6ff" stroke-width="2"/><text x="64" y="219" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18">Client Tools</text><rect x="24" y="248" width="420" height="48" rx="12" fill="#0b1119" stroke="#26364b"/><circle cx="44" cy="272" r="7" fill="none" stroke="#55d6ff" stroke-width="2"/><text x="64" y="279" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18">uiContext after action</text></g><g transform="translate(684 174)"><rect width="468" height="326" rx="20" fill="url(#panel)" stroke="#a78bfa" stroke-opacity=".82"/><text x="24" y="42" fill="#a78bfa" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="750">Runtime</text><rect x="24" y="68" width="198" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="123" y="104" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">Skills</text><rect x="246" y="68" width="198" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="345" y="104" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">Route &amp; plan</text><rect x="24" y="142" width="198" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="123" y="178" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">Run Engine</text><rect x="246" y="142" width="198" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="345" y="178" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">Knowledge / RAG</text><rect x="24" y="216" width="198" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="123" y="252" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">Memory</text><rect x="246" y="216" width="198" height="58" rx="12" fill="#0b1119" stroke="#26364b"/><text x="345" y="252" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17">Models / Providers</text></g><text x="600" y="246" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">browser RPC</text><path d="M536 264 H664" stroke="#55d6ff" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#cyanArrow)"/>
<text x="600" y="320" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">SSE / tool calls</text><path d="M664 338 H536" stroke="#a78bfa" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#purpleArrow)"/>
<rect x="538" y="374" width="124" height="76" rx="14" fill="#0b1119" stroke="#526177" stroke-dasharray="5 4"/><text x="600" y="404" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16">host remains</text><text x="600" y="426" text-anchor="middle" fill="#d7e0ea" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16">source of truth</text><rect x="48" y="524" width="1104" height="44" rx="15" fill="#0b1119" stroke="#243246"/>
<text x="600" y="552" text-anchor="middle" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18">The frontend executes real actions. Spotlight coordinates intent, retrieval, state, and recovery.</text></svg>