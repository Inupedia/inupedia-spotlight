<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
<title id="title">Frontend host and Spotlight Runtime boundary</title><desc id="desc">Two balanced panels showing frontend-host and runtime responsibilities.</desc>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121a26"/><stop offset="1" stop-color="#0c131d"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c8ba0"/></marker>
  </defs>
<rect width="1200" height="590" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="588" rx="29" fill="none" stroke="#223044"/>
<text x="48" y="44" fill="#55d6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" letter-spacing="2.2">RUNTIME RESPONSIBILITIES</text>
  <text x="48" y="94" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="40" font-weight="800">Frontend host ↔ Spotlight Runtime</text>
  <text x="48" y="126" fill="#93a2b7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="18">Business execution stays in the host; Spotlight manages routing, context, and runs.</text>
