  <text x="48" y="94" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="40" font-weight="800">Integration flow</text>
  <text x="48" y="126" fill="#93a2b7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="18">Distill stable frontend capabilities into a thin Spotlight layer.</text>
