<rect x="48" y="462" width="1104" height="46" rx="15" fill="#0b1119" stroke="#243246"/><text x="72" y="491" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="15">Current automated integration is strongest for Vue / Vite; the architecture itself is framework-agnostic.</text>
<rect x="48" y="526" width="1104" height="44" rx="15" fill="#0b1119" stroke="#243246"/><text x="600" y="554" text-anchor="middle" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="16">Do not rebuild the product. Expose real capabilities and let Spotlight orchestrate them.</text></svg>