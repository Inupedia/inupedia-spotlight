<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Spotlight integration flow</title><desc id="desc">Five-stage Spotlight adoption flow from an existing frontend product through capability discovery and spotlight-integrate to the generated layer and Spotlight Runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset="1" stop-color="#0c1320"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111925"/><stop offset="1" stop-color="#0c131d"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#77879c"/></marker>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="518" rx="29" fill="none" stroke="#223044"/>
  <text x="48" y="44" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700" letter-spacing="2.2">FASTEST ADOPTION PATH</text>
  <text x="48" y="94" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" font-weight="800">Integration flow</text>
  <text x="48" y="125" fill="#93a2b7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Use a Coding Agent to distill real frontend capabilities into Spotlight adapters and runtime assets.</text>
  <g transform="translate(48 168)">
    <g id="s1"><rect width="190" height="230" rx="18" fill="url(#panel)" stroke="#2b9fbd"/><circle cx="30" cy="30" r="15" fill="#0b1119" stroke="#55d6ff" stroke-width="2"/><text x="30" y="36" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">1</text><text x="56" y="27" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750">Existing frontend</text><text x="56" y="47" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750">product</text><path d="M18 65h154" stroke="#2a394d"/><rect x="50" y="88" width="90" height="58" rx="9" fill="none" stroke="#55d6ff" stroke-width="2.5"/><path d="M50 105h90M64 88v17" stroke="#55d6ff" stroke-width="2"/><rect x="67" y="116" width="22" height="16" fill="none" stroke="#55d6ff" stroke-width="2"/><rect x="99" y="116" width="30" height="16" fill="none" stroke="#55d6ff" stroke-width="2"/><text x="95" y="177" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">pages · services</text><text x="95" y="197" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">stores · SDKs</text></g>
    <path d="M198 115h28" stroke="#77879c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(234)"><rect width="190" height="230" rx="18" fill="url(#panel)" stroke="#3c7ea0"/><circle cx="30" cy="30" r="15" fill="#0b1119" stroke="#55d6ff" stroke-width="2"/><text x="30" y="36" text-anchor="middle" fill="#55d6ff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">2</text><text x="56" y="37" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750">Capability discovery</text><path d="M18 65h154" stroke="#2a394d"/><circle cx="87" cy="113" r="32" fill="none" stroke="#55d6ff" stroke-width="2.5"/><path d="M109 135l23 23" stroke="#7b9cff" stroke-width="4" stroke-linecap="round"/><path d="M64 115h12l7-14 9 27 8-13h12" fill="none" stroke="#55d6ff" stroke-width="2.5"/><text x="95" y="177" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">find stable actions</text><text x="95" y="197" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">and data flows</text></g>
    <path d="M432 115h28" stroke="#77879c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(468)"><rect width="190" height="230" rx="18" fill="url(#panel)" stroke="#705ca6"/><circle cx="30" cy="30" r="15" fill="#0b1119" stroke="#8b9dff" stroke-width="2"/><text x="30" y="36" text-anchor="middle" fill="#8b9dff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">3</text><text x="56" y="37" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750">spotlight-integrate</text><path d="M18 65h154" stroke="#2a394d"/><rect x="63" y="91" width="64" height="52" rx="15" fill="none" stroke="url(#accent)" stroke-width="2.5"/><circle cx="82" cy="117" r="5" fill="#7b9cff"/><circle cx="108" cy="117" r="5" fill="#a78bfa"/><path d="M95 91v-12M89 79h12" stroke="#7b9cff" stroke-width="2.5" stroke-linecap="round"/><path d="M54 106l-12 11 12 11M136 106l12 11-12 11" fill="none" stroke="#7b9cff" stroke-width="2.5"/><text x="95" y="177" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Coding Agent</text><text x="95" y="197" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">distills adapters</text></g>
    <path d="M666 115h28" stroke="#77879c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(702)"><rect width="190" height="230" rx="18" fill="url(#panel)" stroke="#4e6fa1"/><circle cx="30" cy="30" r="15" fill="#0b1119" stroke="#7b9cff" stroke-width="2"/><text x="30" y="36" text-anchor="middle" fill="#7b9cff" font-family="ui-monospace,monospace" font-size="16" font-weight="700">4</text><text x="56" y="37" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750">Generated layer</text><path d="M18 65h154" stroke="#2a394d"/><path d="M61 104l34-18 34 18-34 18Z" fill="none" stroke="#55d6ff" stroke-width="2.5"/><path d="M61 121l34 18 34-18M61 138l34 18 34-18" fill="none" stroke="#a78bfa" stroke-width="2.5"/><text x="95" y="177" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Client Tools · Skills</text><text x="95" y="197" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">Project Pack</text></g>
    <path d="M900 115h28" stroke="#77879c" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(936)"><rect width="168" height="230" rx="18" fill="url(#panel)" stroke="#8f56b8"/><circle cx="30" cy="30" r="15" fill="#0b1119" stroke="#a78bfa" stroke-width="2"/><text x="30" y="36" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="16" font-weight="700">5</text><text x="56" y="37" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750">Spotlight Runtime</text><path d="M18 65h132" stroke="#2a394d"/><path d="M50 99h68a12 12 0 0 1 12 12v28a12 12 0 0 1-12 12H91l-18 16v-16H50a12 12 0 0 1-12-12v-28a12 12 0 0 1 12-12Z" fill="none" stroke="#a78bfa" stroke-width="2.5"/><circle cx="67" cy="125" r="4" fill="#7b9cff"/><circle cx="84" cy="125" r="4" fill="#8b9dff"/><circle cx="101" cy="125" r="4" fill="#a78bfa"/><text x="84" y="187" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">natural-language use</text><text x="84" y="204" text-anchor="middle" fill="#a9b5c6" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">of original capabilities</text></g>
  </g>
  <rect x="48" y="414" width="1104" height="36" rx="14" fill="#0b1119" stroke="#243246"/><text x="76" y="438" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Current automated integration is strongest for <tspan fill="#55d6ff">Vue / Vite</tspan>, but Spotlight’s architecture is not limited to one frontend framework.</text>
  <rect x="48" y="462" width="1104" height="34" rx="14" fill="#0b1119" stroke="#243246"/><text x="600" y="484" text-anchor="middle" fill="#9ba9bb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Do not rebuild the product. <tspan fill="#55d6ff">Expose real capabilities</tspan> and let <tspan fill="#a78bfa">Spotlight orchestrate them</tspan>.</text>
</svg>